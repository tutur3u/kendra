version: 2
updates:
- package-ecosystem: "bun"
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "03:00"
    timezone: "Asia/Ho_Chi_Minh"
  open-pull-requests-limit: 5
  labels: ["dependencies"]
  groups:
    bun-minor-patch:
      patterns: ["*"]
      update-types: ["minor", "patch"]
